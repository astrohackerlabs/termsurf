[workspace]
members = [
    "code/webbuf/rs/webbuf",
    "code/webbuf/rs/sha256",
    "code/webbuf/rs/sha1",
    "code/webbuf/rs/aescbc",
    "code/webbuf/rs/x25519",
    "code/webbuf/rs/secp256k1",
    "code/webbuf/rs/ripemd160",
    "code/webbuf/rs/mldsa",
    "code/webbuf/rs/mlkem",
    "code/webbuf/rs/pbkdf2_sha256",
    "code/webbuf/rs/blake3",
    "code/webbuf/rs/slhdsa",
    "code/webbuf/rs/ed25519",
    "code/webbuf/rs/p256",
    "code/webbuf/rs/aesgcm",
    "code/termsurf/rs/ahweb",
    "code/termsurf/rs/ah-chromiumd",
    "code/termsurf/rs/ahnexus",
    "code/earthbucks/rs/ebxlib",
    "code/earthbucks/rs/ebxfloat",
    "code/earthbucks/rs/ebxpow5",
    "code/earthbucks/rs/ebxmine",
]
exclude = [
    "code/nutorch/rs",
    "vendor",
    "code/termsurf/proto/test-rust",
    "forks",
    "patches",
    "scripts",
    "docs",
    "node_modules",
    "target",
    "dist",
    "logs",
    "assets",
    "skills",
]
resolver = "2"

[patch.crates-io]
webbuf = { path = "code/webbuf/rs/webbuf" }
webbuf_aescbc = { path = "code/webbuf/rs/aescbc" }
webbuf_aesgcm = { path = "code/webbuf/rs/aesgcm" }
webbuf_blake3 = { path = "code/webbuf/rs/blake3" }
webbuf_mldsa = { path = "code/webbuf/rs/mldsa" }
webbuf_mlkem = { path = "code/webbuf/rs/mlkem" }
webbuf_p256 = { path = "code/webbuf/rs/p256" }
webbuf_pbkdf2_sha256 = { path = "code/webbuf/rs/pbkdf2_sha256" }
webbuf_ripemd160 = { path = "code/webbuf/rs/ripemd160" }
webbuf_secp256k1 = { path = "code/webbuf/rs/secp256k1" }
webbuf_sha256 = { path = "code/webbuf/rs/sha256" }
webbuf_sha1 = { path = "code/webbuf/rs/sha1" }
webbuf_slhdsa = { path = "code/webbuf/rs/slhdsa" }
webbuf_x25519 = { path = "code/webbuf/rs/x25519" }
webbuf_ed25519 = { path = "code/webbuf/rs/ed25519" }
