[package]
name = "ahweb"
version = "0.1.106"
edition = "2021"

[[bin]]
name = "ahweb"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
# Nav full-redraw uses force_full_redraw (resize/clear_viewport), not Terminal::clear,
# so concurrent event::read is safe with ratatui-core ≥ 0.1.2 (Issue 26080220381373 Exp 2).
ratatui = "0.30"
edtui = { version = "0.11.1", default-features = false, features = ["arboard"] }
arboard = "3"
libc = "0.2"
prost = "0.14"
clap = { version = "4.5.60", features = ["derive"] }

[build-dependencies]
prost-build = "0.14"
