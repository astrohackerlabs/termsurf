[package]
name = "ahweb"
version = "0.1.102"
edition = "2021"

[[bin]]
name = "ahweb"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
# Pin pre-CPR-on-clear tree (Issue 26080220381373 Exp 1).
# ratatui 0.30.2 / ratatui-core 0.1.2 make Terminal::clear() call
# get_cursor_position() (CSI 6n), which races ahweb's concurrent event::read.
# Direct exact pins hold transitively: edtui/macros otherwise re-float widgets→0.3.2→core 0.1.2.
ratatui = "=0.30.0"
ratatui-core = "=0.1.0"
ratatui-widgets = "=0.3.0"
ratatui-macros = "=0.7.0"
ratatui-crossterm = "=0.1.0"
edtui = { version = "0.11.1", default-features = false, features = ["arboard"] }
arboard = "3"
libc = "0.2"
prost = "0.14"
clap = { version = "4.5.60", features = ["derive"] }

[build-dependencies]
prost-build = "0.14"
